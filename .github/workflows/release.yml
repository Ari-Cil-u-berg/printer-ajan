name: release

# Tag a version to cut a release.
#
# WINDOWS ONLY, for now, and unsigned. Signing needs an OV/EV certificate we do
# not have yet; the installer works without one, it just makes SmartScreen warn
# on first run (the download page explains that). macOS is a different problem:
# an un-notarized DMG does not warn, it refuses to open, so shipping one would
# be worse than shipping nothing. `npm run dist:mac` still builds locally.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # CSC_LINK is intentionally absent: electron-builder signs only when it is
      # set, so this produces an unsigned NSIS installer plus the latest.yml that
      # electron-updater reads. Adding the secret later needs no change here.
      - name: Build and publish the NSIS installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --win

      # A release whose latest.yml is missing is an app that never updates
      # again, and nothing else in the pipeline would notice.
      - name: Verify the update feed was produced
        shell: pwsh
        run: |
          if (-not (Test-Path release/latest.yml)) {
            throw "latest.yml missing — electron-updater would have no feed to read"
          }
          Get-Content release/latest.yml
