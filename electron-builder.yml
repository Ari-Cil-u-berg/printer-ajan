appId: com.ariadisyon.printagent
productName: Ari Adisyon Yazici Ajani
copyright: © Ari Adisyon
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
asar: true
asarUnpack:
  # powershell.exe must read the script from disk — it cannot be inside the asar.
  - dist/main/assets/**

# macOS only; the hook returns immediately on Windows. See the script for why an
# unsigned mac build still has to be ad-hoc signed to launch at all.
afterPack: scripts/adhoc-sign.mjs

publish:
  provider: github
  owner: Ari-Cil-u-berg
  repo: printer-ajan
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png # electron-builder derives the .ico

  # UNSIGNED, deliberately and temporarily.
  #
  # electron-builder signs only when CSC_LINK is present, so leaving the secret
  # unset already produces an unsigned installer. The line that matters is the
  # next one: electron-updater refuses an update whose signature does not match
  # the installed app's publisher, and with nothing signed there is no publisher
  # to match — so with the default `true`, every auto-update would fail on
  # Windows with "publisher name mismatch" and cafés would silently stop
  # receiving fixes.
  #
  # The trade is real: an unsigned update is authenticated by TLS to GitHub plus
  # the SHA-512 in latest.yml, and no longer by the OS. That is the same trust
  # the first download already relies on. Flip this back to true the day a
  # certificate exists, in the same commit that adds CSC_LINK.
  verifyUpdateCodeSignature: false

  # Kept ready for that day; harmless while unsigned.
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerLanguages: [tr_TR, en_US]
  language: 1055 # Turkish

# macOS ships UNSIGNED, deliberately and temporarily — no Developer ID
# certificate yet.
#
# `identity: null` is load-bearing, not a shortcut. Left unset, electron-builder
# picks whatever certificate the build machine happens to hold, and the only one
# on ours is an *Apple Development* certificate. That combination — a Development
# identity plus `hardenedRuntime` plus no notarization ticket — is the one macOS
# treats worst: Gatekeeper does not warn, it reports the app as damaged and
# refuses to launch, with no way through. Ad-hoc signing is genuinely better
# here, because "unidentified developer" is a dialog the user can clear from
# System Settings, and "damaged" is not.
#
# hardenedRuntime is off for the same reason: it only buys anything alongside a
# notarization ticket, and without one it merely closes the escape hatch.
#
# The trade is real. The first launch costs the café a trip through Privacy &
# Security → "Yine de Aç", and macOS auto-update is off (see src/main/updater.ts
# — Squirrel.Mac verifies the signature of the downloaded build, so an unsigned
# app cannot update itself). Both disappear the day a Developer ID certificate
# exists: set `identity` to it, `hardenedRuntime: true`, `notarize: true`, add
# CSC_LINK + the notary secrets, and drop the darwin guard in the updater.
mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.business
  icon: build/icon.png # electron-builder derives the .icns
  identity: null
  hardenedRuntime: false
  notarize: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # LSUIElement: tray-only, no Dock icon.
  extendInfo:
    LSUIElement: 1
    NSPrintingUsageDescription: Fiş yazdırmak için yazıcılara erişim gerekir.

dmg:
  title: Ari Adisyon Yazıcı Ajanı
